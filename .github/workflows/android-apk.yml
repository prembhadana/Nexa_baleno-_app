
name: Build NEXA Baleno APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NEXA_Baleno_Android_Project.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -q NEXA_Baleno_Android_Project.zip

      - name: Build APK
        run: gradle -p NEXA_Baleno_Android_Project :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-Baleno-debug-APK
          path: NEXA_Baleno_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
