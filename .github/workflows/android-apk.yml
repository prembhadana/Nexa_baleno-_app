
name: Build NEXA Baleno APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NEXA_Baleno_Android_Project.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -q NEXA_Baleno_Android_Project.zip

      - name: Configure Java and Kotlin
        run: |
          cat > NEXA_Baleno_Android_Project/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.nexa.quotation'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.nexa.quotation'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

      - name: Build APK
        run: gradle -p NEXA_Baleno_Android_Project :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-Baleno-debug-APK
          path: NEXA_Baleno_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
